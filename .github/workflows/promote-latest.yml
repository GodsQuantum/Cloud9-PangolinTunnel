name: Promote validated tunnel candidate to rolling latest
on:
  workflow_dispatch:
    inputs:
      candidate_ref:
        description: "Exactly one successful candidate GHCR image tag"
        required: true
        type: string
permissions:
  contents: read
  actions: read
  packages: write
concurrency:
  group: pangolin-production-channel
  cancel-in-progress: false
jobs:
  promote:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Confirm successful test run and image provenance
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          CANDIDATE_REF: ${{ inputs.candidate_ref }}
        run: |
          set -euo pipefail
          ref="$CANDIDATE_REF"
          [[ "$ref" =~ ^ghcr.io/godsquantum/cloud9-pangolin-tunnel:upstream-[0-9a-f]{12}-patch-[0-9a-f]{12}-run-[0-9]+$ ]]
          run_id="$(echo "$ref" | sed -E 's/^.*-run-([0-9]+)$/\1/')"
          patch_sha="$(echo "$ref" | sed -nE 's/^.*-patch-([0-9a-f]{12})-run-.*$/\1/p')"
          conclusion="$(gh run view "$run_id" --repo "$GITHUB_REPOSITORY" --json conclusion --jq .conclusion)"
          head_sha="$(gh run view "$run_id" --repo "$GITHUB_REPOSITORY" --json headSha --jq .headSha)"
          test "$conclusion" = success
          [[ "$head_sha" == "$patch_sha"* ]]
          docker pull "$ref"
          test "$(docker image inspect "$ref" --format '{{index .Config.Labels "org.opencontainers.image.source"}}')" = "https://github.com/GodsQuantum/Cloud9-PangolinTunnel"
          test "$(docker image inspect "$ref" --format '{{.Config.User}}')" = '65532:65532'
          test "$(docker image inspect "$ref" --format '{{index .Config.Labels "com.cloud9.upstream.revision"}}' | wc -c)" -eq 41
          echo PANGOLIN_GHCR_RELEASE_PROVENANCE_PASS
      - name: Publish same manifest as rolling latest without rebuilding
        shell: bash
        env:
          CANDIDATE_REF: ${{ inputs.candidate_ref }}
        run: |
          set -euo pipefail
          docker buildx imagetools create -t ghcr.io/godsquantum/cloud9-pangolin-tunnel:latest "$CANDIDATE_REF"
          docker buildx imagetools inspect ghcr.io/godsquantum/cloud9-pangolin-tunnel:latest
          echo 'Published same validated candidate as the public rolling latest channel; no Go compilation on the server.' >> "$GITHUB_STEP_SUMMARY"
